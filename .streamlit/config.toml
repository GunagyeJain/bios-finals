# Theme from docs/05-solution/ui-design.md §1: "control room" dark. Layered navy surfaces, one bright
# indigo brand accent for selection and the primary action, display type in Space Grotesk.
[theme]
base = "dark"
backgroundColor = "#0b0e14"
secondaryBackgroundColor = "#131925"
textColor = "#ffffff"
primaryColor = "#7b8cff"
linkColor = "#ffffff"
linkUnderline = false
borderColor = "#232b3a"
dataframeBorderColor = "#1c2330"
dataframeHeaderBackgroundColor = "#161d2a"
dataframeHeaderTextColor = "#93a0b8"
greenColor = "#44a282"
yellowColor = "#d9a441"
redColor = "#e5566f"
blueColor = "#7b8cff"
font = "'Public Sans':https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap, system-ui, sans-serif"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
baseFontSize = 14
baseRadius = "10px"
buttonRadius = "full"
showWidgetBorder = true

[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true      # app/static/ (git-ignored): rendered videos for the synced player
